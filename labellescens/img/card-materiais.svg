<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f37"/><stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <pattern id="cn" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M32 0V64M0 32H64" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="860" fill="url(#bg)"/>
  <rect width="600" height="860" fill="url(#cn)"/>
  <!-- três frascos de essência -->
  <g fill="none" stroke="#caa86a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- frasco esq -->
    <rect x="170" y="380" width="84" height="150" rx="14"/>
    <rect x="196" y="356" width="32" height="26" rx="5"/>
    <line x1="212" y1="356" x2="212" y2="342"/>
    <!-- frasco centro (alto) -->
    <rect x="262" y="330" width="90" height="200" rx="14"/>
    <rect x="290" y="300" width="34" height="32" rx="6"/>
    <line x1="307" y1="300" x2="307" y2="282"/>
    <line x1="278" y1="430" x2="336" y2="430" stroke-opacity="0.5"/>
    <!-- frasco dir -->
    <rect x="360" y="398" width="74" height="132" rx="12"/>
    <rect x="383" y="376" width="28" height="24" rx="5"/>
    <line x1="397" y1="376" x2="397" y2="364"/>
  </g>
  <!-- gota -->
  <path d="M300 200 C 320 232 320 252 300 252 C 280 252 280 232 300 200 Z" fill="none" stroke="#cfc6b4" stroke-width="2.4" stroke-opacity="0.85"/>
</svg>
