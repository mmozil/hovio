<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
<defs>
<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>
<linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8f7f1"/><stop offset=".6" stop-color="#d7cfbf"/><stop offset="1" stop-color="#8a8071"/></linearGradient><radialGradient id="pearl"><stop stop-color="#fff"/><stop offset=".65" stop-color="#e6e0d6"/><stop offset="1" stop-color="#a69d8e"/></radialGradient><linearGradient id="jar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".9"/><stop offset=".5" stop-color="#ddd6ca"/><stop offset="1" stop-color="#8c8275"/></linearGradient></defs>
<rect width="900" height="1200" fill="url(#mbg)"/>
<path d="M-80 160 C170 360 230 580 120 930 C60 1110 230 1260 470 1300" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="210"/>
<path d="M930 50 C680 230 640 450 760 700 C850 900 720 1120 540 1260" fill="none" stroke="#b9b0a2" stroke-opacity=".52" stroke-width="170"/>
<g opacity=".84"><circle cx="160" cy="240" r="74" fill="url(#pearl)"/><circle cx="760" cy="355" r="52" fill="url(#pearl)"/><circle cx="190" cy="980" r="46" fill="url(#pearl)"/></g>
<ellipse cx="480" cy="930" rx="270" ry="65" fill="#403b35" opacity=".2" filter="url(#blur18)"/>
<g filter="url(#shadow)">
<ellipse cx="480" cy="580" rx="230" ry="90" fill="#e8e1d7"/>
<rect x="250" y="580" width="460" height="330" rx="72" fill="url(#jar)"/>
<ellipse cx="480" cy="580" rx="230" ry="90" fill="#f8f4ec" stroke="#fff" stroke-opacity=".8"/>
<ellipse cx="480" cy="568" rx="165" ry="48" fill="#fff" opacity=".82"/>
<text x="480" y="738" text-anchor="middle" font-family="Georgia,serif" font-size="42" letter-spacing="8" fill="#38332e">ÉLAN</text>
<text x="480" y="782" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#746c64">RITUEL DE LUMIÈRE</text>
</g>
<rect width="900" height="1200" filter="url(#grain)" opacity=".25"/>
</svg>