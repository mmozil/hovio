<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100"><defs>
<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>
<linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ed"/><stop offset="1" stop-color="#c7a58d"/></linearGradient></defs><rect width="900" height="1100" fill="url(#sbg)"/><g transform="translate(250 300)"><rect x="0" y="120" width="130" height="350" rx="26" fill="#d6b598"/><rect x="40" y="60" width="50" height="90" rx="10" fill="#2b2521"/><rect x="190" y="0" width="160" height="470" rx="34" fill="#f4efe7"/><rect x="235" y="-60" width="70" height="95" rx="10" fill="#2b2521"/><rect x="410" y="170" width="130" height="300" rx="24" fill="#9c7d65"/><rect x="450" y="115" width="50" height="80" rx="8" fill="#2b2521"/></g><text x="450" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="5" fill="#332c27">AMOSTRAS</text><rect width="900" height="1100" filter="url(#grain)" opacity=".25"/></svg>