<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200"><defs>
<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>
<linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset=".55" stop-color="#e1c9aa"/><stop offset="1" stop-color="#9a6844"/></linearGradient><radialGradient id="drop"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".75" stop-color="#e5bd8e" stop-opacity=".5"/><stop offset="1" stop-color="#8c4d29" stop-opacity=".65"/></radialGradient></defs><rect width="900" height="1200" fill="url(#lbg)"/><path d="M-80 230 C260 10 590 180 980 10" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="170"/><path d="M-70 950 C310 700 650 890 980 600" fill="none" stroke="#6b3d25" stroke-opacity=".26" stroke-width="220"/><ellipse cx="500" cy="535" rx="180" ry="270" fill="url(#drop)" transform="rotate(18 500 535)"/><ellipse cx="260" cy="880" rx="90" ry="140" fill="url(#drop)" transform="rotate(-21 260 880)"/><rect width="900" height="1200" filter="url(#grain)" opacity=".28"/></svg>