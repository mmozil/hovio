</filter>
<radialGradient id="dbg" cx="50%" cy="38%"><stop stop-color="#584027"/><stop offset=".36" stop-color="#16110d"/><stop offset="1" stop-color="#030303"/></radialGradient><linearGradient id="amber" x1="0" x2="1"><stop stop-color="#29130a"/><stop offset=".25" stop-color="#e4a55d"/><stop offset=".5" stop-color="#6f2c0d"/><stop offset=".78" stop-color="#d28a3e"/><stop offset="1" stop-color="#160a06"/></linearGradient></defs>
<rect width="1600" height="1000" fill="url(#dbg)"/>
<ellipse cx="800" cy="850" rx="360" ry="80" fill="#b47437" opacity=".25" filter="url(#blur40)"/>
<g transform="translate(590 165)" filter="url(#shadow)">
<rect x="0" y="120" width="420" height="560" rx="44" fill="url(#amber)" stroke="#ffcc85" stroke-opacity=".25" stroke-width="2"/>
<rect x="98" y="10" width="224" height="170" rx="14" fill="#090706" stroke="#826344"/>
<rect x="132" y="0" width="156" height="40" rx="8" fill="#b78b50"/>
