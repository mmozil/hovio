<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
<defs>
<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>
<linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d9d5"/><stop offset=".48" stop-color="#ae5f65"/><stop offset="1" stop-color="#3c1721"/></linearGradient><radialGradient id="rg"><stop stop-color="#fff" stop-opacity=".78"/><stop offset="1" stop-color="#f2b3b9" stop-opacity="0"/></radialGradient><linearGradient id="bottle" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".76"/><stop offset=".45" stop-color="#f6cfbf" stop-opacity=".5"/><stop offset="1" stop-color="#7a2638" stop-opacity=".72"/></linearGradient></defs>
<rect width="900" height="1200" fill="url(#rbg)"/>
<circle cx="260" cy="310" r="330" fill="url(#rg)" filter="url(#blur18)"/>
<g fill="none" stroke-linecap="round" opacity=".66">
<path d="M-80 900 C130 590 190 310 480 80" stroke="#f9dfe2" stroke-width="150"/>
<path d="M100 1260 C300 870 520 520 920 370" stroke="#581c31" stroke-width="190"/>
<path d="M420 1260 C520 880 690 700 980 590" stroke="#d8959d" stroke-width="105"/>
</g>
<g transform="translate(270 340)" filter="url(#shadow)">
<rect x="0" y="110" width="360" height="500" rx="150" fill="url(#bottle)" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
<path d="M110 140 L110 35 Q110 0 145 0 H215 Q250 0 250 35 V140" fill="#d8b498"/>
<rect x="90" y="0" width="180" height="90" rx="18" fill="#241014"/>
<text x="180" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="45" letter-spacing="8" fill="#3c1820">ÉLAN</text>
<text x="180" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" letter-spacing="4" fill="#6d303b">JARDIN SECRET</text>
</g>
<rect width="900" height="1200" filter="url(#grain)" opacity=".34"/>
</svg>