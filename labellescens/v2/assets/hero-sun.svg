<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
<defs>

<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe0ce"/><stop offset=".46" stop-color="#c98c66"/><stop offset="1" stop-color="#6f3e35"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fff4cc"/><stop offset=".55" stop-color="#efbd7d"/><stop offset="1" stop-color="#d78258" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".72"/><stop offset=".2" stop-color="#e4b786" stop-opacity=".32"/><stop offset=".72" stop-color="#7f431f" stop-opacity=".58"/><stop offset="1" stop-color="#170b08" stop-opacity=".82"/></linearGradient>
<linearGradient id="cap" x1="0" x2="1"><stop stop-color="#160d0a"/><stop offset=".5" stop-color="#8e6952"/><stop offset="1" stop-color="#100906"/></linearGradient>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<ellipse cx="1040" cy="280" rx="470" ry="430" fill="url(#sun)" filter="url(#blur40)"/>
<path d="M-90 1000 C260 680 330 210 690 -60" fill="none" stroke="#2b160f" stroke-opacity=".28" stroke-width="56" filter="url(#blur18)"/>
<path d="M120 1150 C360 800 580 400 900 120" fill="none" stroke="#f0d0a7" stroke-opacity=".28" stroke-width="28"/>
<g opacity=".28" transform="translate(1210 250) rotate(22)">
  <ellipse cx="0" cy="0" rx="65" ry="260" fill="#38231a"/><ellipse cx="-80" cy="240" rx="55" ry="220" fill="#38231a"/><ellipse cx="80" cy="250" rx="55" ry="230" fill="#38231a"/>
</g>
<ellipse cx="822" cy="929" rx="270" ry="55" fill="#1b0906" opacity=".28" filter="url(#blur18)"/>
<g filter="url(#shadow)">
  <rect x="646" y="280" width="356" height="570" rx="108" fill="url(#glass)" stroke="#fff" stroke-opacity=".34" stroke-width="3"/>
  <rect x="704" y="173" width="240" height="145" rx="34" fill="url(#cap)"/>
  <rect x="736" y="142" width="176" height="58" rx="18" fill="#17100e"/>
  <rect x="696" y="466" width="256" height="190" rx="4" fill="#efe5d8" fill-opacity=".84"/>
  <text x="824" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="38" letter-spacing="9" fill="#1b1512">ÉLAN</text>
  <text x="824" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="5" fill="#6c5144">L'ÉCLAT SOLAIRE</text>
  <line x1="754" y1="611" x2="894" y2="611" stroke="#745b50" stroke-opacity=".55"/>
</g>
<rect width="1600" height="1100" filter="url(#grain)" opacity=".36"/>
</svg>