</filter>
<linearGradient id="redbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f2133"/><stop offset=".45" stop-color="#420b19"/><stop offset="1" stop-color="#110307"/></linearGradient><linearGradient id="lip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7c7e"/><stop offset=".45" stop-color="#c71535"/><stop offset="1" stop-color="#560719"/></linearGradient></defs><rect width="900" height="1200" fill="url(#redbg)"/><path d="M-90 180 C220 420 400 280 920 80" fill="none" stroke="#e96a76" stroke-opacity=".25" stroke-width="180"/><path d="M-90 1050 C250 790 600 1000 980 760" fill="none" stroke="#170208" stroke-opacity=".48" stroke-width="240"/><g transform="translate(310 260) rotate(8 150 350)" filter="url(#shadow)"><rect x="54" y="360" width="190" height="420" rx="18" fill="#100c0d"/><rect x="76" y="500" width="146" height="250" fill="#b98a62"/><path d="M78 360 L218 360 L218 205 Q218 150 194 108 L160 50 Q145 28 126 55 L99 96 Q78 126 78 184 Z" fill="url(#lip)"/></g><rect width="900" height="1200" filter="url(#grain)" opacity=".45"/></svg>