<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100"><defs>
<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>
<linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ed"/><stop offset="1" stop-color="#90806e"/></linearGradient></defs><rect width="900" height="1100" fill="url(#sbg)"/><rect x="295" y="300" width="310" height="470" rx="110" fill="#eee8de" stroke="#6d6258" stroke-width="3"/><rect x="365" y="220" width="170" height="120" rx="20" fill="#25201d"/><text x="450" y="535" text-anchor="middle" font-family="Georgia,serif" font-size="44" letter-spacing="7" fill="#5d5046">ÉLAN</text><path d="M350 600 Q450 650 550 600" fill="none" stroke="#9c7b60" stroke-width="3"/><text x="450" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="5" fill="#332c27">PERSONALIZAÇÃO</text><rect width="900" height="1100" filter="url(#grain)" opacity=".25"/></svg>