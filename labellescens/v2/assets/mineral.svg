<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
<filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
</filter>
<filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
</filter>
<linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9d8d3"/><stop offset=".5" stop-color="#8c999d"/><stop offset="1" stop-color="#333a3c"/></linearGradient><linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1eee7"/><stop offset=".5" stop-color="#9caaa9"/><stop offset="1" stop-color="#596464"/></linearGradient></defs>
<rect width="1600" height="1000" fill="url(#bgm)"/>
<path d="M-100 850 C350 580 520 120 1040 -80 L1190 -80 C700 280 640 790 130 1110Z" fill="#eef0eb" opacity=".56"/>
<path d="M840 1080 C960 700 1120 400 1670 160" fill="none" stroke="#20292b" stroke-width="230" opacity=".44"/>
<g transform="translate(620 190)" filter="url(#shadow)"><path d="M180 0 L330 90 L370 520 Q350 650 180 700 Q10 650 -10 520 L30 90 Z" fill="url(#stone)" stroke="#fff" stroke-opacity=".4"/><rect x="90" y="220" width="180" height="150" fill="#f2eee6" fill-opacity=".72"/><text x="180" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="35" letter-spacing="7" fill="#3e4747">ÉLAN</text><text x="180" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" letter-spacing="3" fill="#596363">MINÉRALE</text></g>
<rect width="1600" height="1000" filter="url(#grain)" opacity=".3"/>
</svg>