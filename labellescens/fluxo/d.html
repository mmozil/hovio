<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Belle Scens — Fluxo de Agente</title>
<link rel="preload" href="/fonts/Atacama-VF.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/HellixVAR.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/Atacama-Italic-VF.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/fonts/fontes.css?v=20260901" />
<link rel="stylesheet" href="/tema.css?v=20260901i" />
<script src="/tema.js?v=20260901i"></script>
<style>
:root{
  --bg:#f8f8f8;--surface:#fff;--ink:#33383c;--ink-strong:#1f2326;--soft:#7b8487;--soft-2:#9aa1a3;
  --line:rgba(51,56,60,.12);--line-strong:#cdc8bf;--accent:#9c8458;--accent-ink:#6f5c37;--accent-soft:#efe9dd;
  --manual:#9a5a5a;--parcial:#9a7d3c;--bloqueado:#5a6f8a;--pronto:#5a7d63;
  --serif:'Atacama','Cormorant Garamond',Georgia,serif;--sans:'Hellix','Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;
  --axes:"wght" 320,"wdth" 100,"CNTR" 20,"XHGT" 0;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.5,1);
}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
@media(hover:hover){.stage{cursor:none}}
.frame{height:100vh;display:flex;flex-direction:column;padding:30px 50px 26px}
.head{display:flex;align-items:flex-start;justify-content:space-between;flex:none}
.brand{display:flex;align-items:baseline;gap:7px}
.brand .lb{font-family:var(--serif);font-size:21px;font-variation-settings:"wght" 400,"wdth" 100,"CNTR" 20,"XHGT" 0;color:var(--ink-strong)}
.brand .bdot{width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateY(-3px)}
.brand .sub{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--soft);text-align:right}
.eyebrow b{color:var(--accent-ink);font-weight:500}
.intro{flex:none;margin-top:14px}
.intro h1{font-family:var(--serif);font-weight:320;font-variation-settings:var(--axes);font-size:clamp(28px,3.4vw,42px);line-height:1.03;letter-spacing:-.02em;color:var(--ink-strong)}
.intro h1 em{font-style:italic;color:var(--accent-ink)}

.stage{flex:1;position:relative;margin-top:10px}
.regions{position:absolute;inset:0;pointer-events:none}
.rlabel{position:absolute;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft-2)}
.rlabel b{color:var(--accent-ink);font-weight:600}
svg.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--line-strong);stroke-width:1.3;opacity:0;transition:opacity .8s var(--ease),stroke .4s var(--ease),stroke-width .4s var(--ease)}
.stage.in .wire{opacity:1}
.wire.hot{stroke:var(--accent);stroke-width:2}
.sig{fill:var(--accent);opacity:0;transition:opacity .6s var(--ease)}
.stage.in .sig{opacity:.9}

.node{position:absolute;transform:translate(-50%,-50%);z-index:3;opacity:0;transition:opacity .6s var(--spring),transform .6s var(--spring)}
.stage.in .node{opacity:1}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;
  box-shadow:0 1px 2px rgba(31,35,38,.04);transition:transform .4s var(--spring),box-shadow .4s var(--ease),border-color .4s var(--ease)}
.card::before,.card::after{content:'';position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:var(--surface);border:1.4px solid var(--line-strong);transform:translateY(-50%)}
.card::before{left:-4px}.card::after{right:-4px}
.node.t .card::before,.node.a .card::after{display:none} /* triggers sem porta-esq, ações sem porta-dir */
.node:hover .card{transform:translateY(-3px);box-shadow:0 18px 44px -18px rgba(31,35,38,.3);border-color:var(--accent)}
.ct{display:flex;align-items:center;gap:9px}
.ct .sd{width:7px;height:7px;border-radius:50%;flex:none}
.ct .tt{font-family:var(--serif);font-variation-settings:"wght" 420,"wdth" 100,"CNTR" 20,"XHGT" 0;font-size:15.5px;color:var(--ink-strong);white-space:nowrap}
.cmeta{font-size:11px;color:var(--soft);margin-top:4px}
.s-manual .sd{background:var(--manual)}.s-parcial .sd{background:var(--parcial)}.s-bloqueado .sd{background:var(--bloqueado)}.s-pronto .sd{background:var(--pronto)}

/* agente */
.node.ag .card{padding:20px 24px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),0 24px 60px -24px rgba(156,132,88,.45)}
.node.ag .card::before,.node.ag .card::after{width:8px;height:8px;border-color:var(--accent);background:var(--accent-soft)}
.ag .glyph{width:34px;height:34px;margin-bottom:11px}
.ag .glyph circle,.ag .glyph line{stroke:var(--accent);stroke-width:1.3;fill:none}
.ag .glyph .core{fill:var(--accent)}
.ag .agt{font-family:var(--serif);font-variation-settings:var(--axes);font-size:23px;color:var(--ink-strong);line-height:1}
.ag .ags{font-size:12px;color:var(--soft);margin-top:6px}
.ag .agtags{display:flex;gap:6px;margin-top:13px}
.ag .agtags span{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:20px;padding:3px 9px}
.ag .pulse{position:absolute;inset:-1px;border-radius:14px;border:1px solid var(--accent);opacity:0;animation:halo 3.4s var(--ease) infinite}
@keyframes halo{0%{opacity:.5;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.06)}}

/* popover detalhe */
.pop{position:absolute;right:calc(100% + 14px);top:50%;transform:translateX(8px) translateY(-50%);width:262px;
  background:var(--ink-strong);color:#e9e3d8;border-radius:11px;padding:15px 17px;box-shadow:0 26px 64px -22px rgba(31,35,38,.55);
  opacity:0;pointer-events:none;z-index:20;transition:opacity .34s var(--ease),transform .34s var(--ease)}
.node:hover .pop{opacity:1;transform:translateX(0) translateY(-50%)}
.pop .pk{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#b7a98a;margin-bottom:5px}
.pop .gap{font-size:13px;line-height:1.45;color:#e9c9b0}
.pop .usr{font-size:12.5px;line-height:1.45;color:#cfc9bd;margin-top:11px}
.pop .act{font-size:13px;line-height:1.45;color:#fff;margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.13)}
.pop .act b{color:#e7cf9b;font-weight:600}
.pop::after{content:'';position:absolute;right:-5px;top:50%;width:10px;height:10px;background:var(--ink-strong);transform:translateY(-50%) rotate(45deg)}

.foot{flex:none;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--soft-2);margin-top:8px}
.legend{display:flex;gap:18px}.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:6px;height:6px;border-radius:50%}
.cur{position:fixed;top:0;left:0;width:30px;height:30px;border:1px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:90;opacity:0;transition:opacity .3s,width .3s var(--ease),height .3s var(--ease),background .3s}
.cur.on{opacity:1}.cur.hot{width:14px;height:14px;background:var(--accent)}
@media(prefers-reduced-motion:reduce){.sig,.ag .pulse{display:none}*{transition:none!important}}
@media(max-width:1000px){.intro h1{font-size:24px}.ct .tt{font-size:14px}}
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <div><div class="brand"><span class="lb">La Belle Scens</span><span class="bdot"></span></div><div class="sub">Gestão de Aromatização</div></div>
    <div class="eyebrow">Fluxo de agente · cenário hoje<br><b>passe o mouse nos nós</b></div>
  </div>
  <div class="intro"><h1>Um <em>agente</em> operando a recorrência</h1></div>

  <div class="stage" id="stage">
    <div class="regions">
      <div class="rlabel" id="rl-trig" style="left:0;top:1%"><b>Sinais</b> · Máquinas · Financeiro · Atendimento</div>
      <div class="rlabel" id="rl-ag" style="left:38%;top:1%"><b>Agente</b> · decide a ação</div>
      <div class="rlabel" id="rl-act" style="right:0;top:1%;text-align:right"><b>Ações</b> · nas áreas mapeadas</div>
    </div>
    <svg class="wires" id="wires"></svg>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i style="background:var(--manual)"></i> Gap (manual)</span>
      <span><i style="background:var(--parcial)"></i> Parcial</span>
      <span><i style="background:var(--bloqueado)"></i> Bloqueado</span>
      <span><i style="background:var(--pronto)"></i> Pronto</span>
    </div>
    <div>Protótipo · La Belle Scens</div>
  </div>
</div>
<div class="cur" id="cur"></div>

<script>
const TRIGGERS=[
 {id:'t1',t:'Telemetria do refil',meta:'nível da máquina',x:11,y:24},
 {id:'t2',t:'Vencimento',meta:'boleto / assinatura',x:11,y:50},
 {id:'t3',t:'Mensagem do cliente',meta:'WhatsApp · e-mail',x:11,y:76},
];
const AGENT={id:'ag',x:42,y:50};
const ACTIONS=[
 {id:'a1',t:'Prevê a “perda”',s:'bloqueado',x:80,y:14,gap:'Não há telemetria confiável do nível do refil.',usr:'O usuário estima a data no olho ou em planilha.',act:'prevê a “perda” <b>automaticamente</b> pela telemetria.'},
 {id:'a2',t:'Agenda a troca',s:'parcial',x:80,y:33,gap:'O lembrete é feito no braço; o Auvo já cobre o campo.',usr:'O usuário avisa o cliente e marca a rota manualmente.',act:'<b>dispara a agenda no Auvo</b> e o lembrete proativo.'},
 {id:'a3',t:'Baixa o estoque',s:'manual',x:80,y:52,gap:'Baixa e “em separação” no braço (Bling + planilha).',usr:'O usuário dá baixa e controla compra/validade na mão.',act:'<b>baixa o estoque</b> e alerta compra e validade.'},
 {id:'a4',t:'Cobra a recorrência',s:'manual',x:80,y:71,gap:'Boleto/assinatura dispersos; cobrança por WhatsApp.',usr:'O usuário cobra cliente a cliente, manualmente.',act:'<b>emite a cobrança recorrente</b> com régua de cobrança.'},
 {id:'a5',t:'Atende e registra (CRM)',s:'manual',x:80,y:90,gap:'Suporte solto no WhatsApp; churn sem monitoramento.',usr:'O usuário responde sem registro de chamado nem estado.',act:'<b>atende, registra e monitora o churn</b> (nasce/morre/ressuscita).'},
];
const SLABEL={manual:'Gap manual',parcial:'Parcial',bloqueado:'Bloqueado',pronto:'Pronto'};
const stage=document.getElementById('stage'),wires=document.getElementById('wires');
const NS='http://www.w3.org/2000/svg';

function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}

function build(){
  // limpa
  [...stage.querySelectorAll('.node')].forEach(n=>n.remove()); wires.innerHTML='';
  // triggers
  TRIGGERS.forEach((s,i)=>{
    const n=el('<div class="node t" id="n-'+s.id+'" style="left:'+s.x+'%;top:'+s.y+'%"><div class="card"><div class="ct"><span class="tt">'+s.t+'</span></div><div class="cmeta">'+s.meta+'</div></div></div>');
    n.style.transitionDelay=(0.15+i*0.08)+'s'; stage.appendChild(n);
  });
  // agente
  const ag=el('<div class="node ag" id="n-ag" style="left:'+AGENT.x+'%;top:'+AGENT.y+'%"><div class="card"><span class="pulse"></span>'+
    '<svg class="glyph" viewBox="0 0 40 40"><circle class="core" cx="20" cy="20" r="4"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="7" r="2.4"/><circle cx="33" cy="20" r="2.4"/><circle cx="20" cy="33" r="2.4"/><circle cx="7" cy="20" r="2.4"/><line x1="20" y1="11" x2="20" y2="16"/><line x1="29" y1="20" x2="24" y2="20"/><line x1="20" y1="29" x2="20" y2="24"/><line x1="11" y1="20" x2="16" y2="20"/></svg>'+
    '<div class="agt">Agente La Belle</div><div class="ags">Entende as regras e orquestra a operação.</div>'+
    '<div class="agtags"><span>Comodato</span><span>Recorrência</span><span>Regras</span></div></div></div>');
  ag.style.transitionDelay='.32s'; stage.appendChild(ag);
  // ações
  ACTIONS.forEach((s,i)=>{
    const flip = '';
    const n=el('<div class="node a s-'+s.s+flip+'" id="n-'+s.id+'" style="left:'+s.x+'%;top:'+s.y+'%"><div class="card"><div class="ct"><span class="sd"></span><span class="tt">'+s.t+'</span></div><div class="cmeta">'+SLABEL[s.s]+'</div></div>'+
      '<div class="pop"><div class="pk">Gap hoje</div><div class="gap">'+s.gap+'</div><div class="usr">'+s.usr+'</div><div class="act">O agente '+s.act+'</div></div></div>');
    n.style.transitionDelay=(0.42+i*0.07)+'s'; stage.appendChild(n);
  });
  drawWires();
}

function center(id){const n=document.getElementById('n-'+id).querySelector('.card');const sr=stage.getBoundingClientRect();const r=n.getBoundingClientRect();
  return {l:r.left-sr.left,r:r.right-sr.left,t:r.top-sr.top,b:r.bottom-sr.top,my:r.top-sr.top+r.height/2};}

function path(a,b){ // de porta direita de a até porta esquerda de b
  const x1=a.r,y1=a.my,x2=b.l,y2=b.my;const dx=Math.max(40,(x2-x1)*.5);
  return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
}
let edges=[];
function drawWires(){
  const W=stage.clientWidth,H=stage.clientHeight;wires.setAttribute('viewBox','0 0 '+W+' '+H);
  edges=[];
  const add=(from,to,key)=>{
    const d=path(center(from),center(to));
    const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','wire');p.id='e-'+from+'-'+to;
    p.dataset.a=from;p.dataset.b=to;wires.appendChild(p);
    // sinais correndo (SMIL)
    const n=2;for(let k=0;k<n;k++){const c=document.createElementNS(NS,'circle');c.setAttribute('r','2.6');c.setAttribute('class','sig');
      const m=document.createElementNS(NS,'animateMotion');m.setAttribute('dur','2.6s');m.setAttribute('repeatCount','indefinite');m.setAttribute('begin',(k*1.3)+'s');m.setAttribute('rotate','auto');
      const mp=document.createElementNS(NS,'mpath');mp.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+p.id);mp.setAttribute('href','#'+p.id);
      m.appendChild(mp);c.appendChild(m);wires.appendChild(c);}
    edges.push({from,to,p});
  };
  TRIGGERS.forEach(t=>add(t.id,'ag'));
  ACTIONS.forEach(a=>add('ag',a.id));
}

build();
requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.add('in')));
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{stage.classList.remove('in');build();requestAnimationFrame(()=>stage.classList.add('in'));},220);});

// hover: acende fios ligados ao nó
stage.addEventListener('pointerover',e=>{
  const node=e.target.closest('.node');
  wires.querySelectorAll('.wire').forEach(w=>{
    const on = node && (w.dataset.a===node.id.slice(2)||w.dataset.b===node.id.slice(2));
    w.classList.toggle('hot',!!on);
  });
});
stage.addEventListener('pointerleave',()=>wires.querySelectorAll('.wire').forEach(w=>w.classList.remove('hot')));

// cursor
const cur=document.getElementById('cur');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,on=false;
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!on){on=true;cur.classList.add('on');}});
  addEventListener('pointerover',e=>cur.classList.toggle('hot',!!e.target.closest('.card')));
  (function l(){cx+=(mx-cx)*.2;cy+=(my-cy)*.2;cur.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%)';requestAnimationFrame(l);})();
}
</script>
</body>
</html>
