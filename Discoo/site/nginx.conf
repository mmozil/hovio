server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 🚨 sem esta linha o Content-Type sai sem charset, o browser cai em latin-1
  # e todo acento vira mojibake (aconteceu no centralfleet)
  charset utf-8;
  add_header X-Content-Type-Options nosniff;
  # o design system é artefato interno: serve, mas não indexa
  location /ds { add_header X-Robots-Tag "noindex, nofollow" always; charset utf-8; }
  # painel do dono (escolhe o modelo do resumo): idem — serve, nunca indexa
  location /config { add_header X-Robots-Tag "noindex, nofollow" always; charset utf-8; }

  # 🚨 arquivo com extensão que não existe tem que dar 404, não a página.
  # Com o fallback abaixo sozinho, um ícone que não subiu volta 200 com HTML
  # dentro e ninguém percebe que o deploy ficou pela metade.
  location ~* \.(ico|png|svg|jpe?g|gif|webp|woff2?|mp4|css|js|txt|json|map)$ {
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
